name: hakori_almadinah
description: "Hakori Almadinah - A clean Flutter application with MVP architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^17.5.0
  image_picker: ^1.1.2
  flutter_svg: ^2.3.0
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_native_splash: ^2.4.7
  webview_flutter: ^4.14.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F172A"
  image: "assets/images/logo.png"
  android: true
  ios: true
